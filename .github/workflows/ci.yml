name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Dockerfile pins Python 3.11 for the backend.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt

      # CI-only exclusion; backend/requirements.txt and tests/requirements.txt are not modified.
      # Why: GitHub-hosted runners have no GPU, and no test imports torch, sentence-transformers or
      # transformers (backend/dart_rag.py imports them lazily, and the GPU test replaces them with mocks
      # in sys.modules). The CUDA wheels (torch==2.8.0+cu128 from the PyTorch index) are several GB, so
      # installing them would only cost time and cache space. Every other pin is installed as written.
      - name: Install dependencies (without CUDA packages)
        run: |
          grep -vE '^(--extra-index-url|torch==|sentence-transformers|transformers)' backend/requirements.txt > "$RUNNER_TEMP/ci-requirements.txt"
          grep -v '^-r ' tests/requirements.txt >> "$RUNNER_TEMP/ci-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/ci-requirements.txt"

      # Tests needing a real PostgreSQL (marker "db") run in the backend-db job; "gpu" needs a CUDA GPU.
      - name: Run pytest
        run: python -m pytest -q -rs --strict-markers -m "not gpu and not db"

  backend-db:
    name: Backend pytest (PostgreSQL)
    runs-on: ubuntu-latest
    # Same image as the db service in docker-compose.yml, so the tests run on the PostgreSQL 15 the app uses.
    # Keep the two in sync. The local embedded PostgreSQL used when MODULE4_TEST_DSN is unset is 18.6.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg15
        env:
          POSTGRES_USER: finguard
          POSTGRES_PASSWORD: finguard-ci
          POSTGRES_DB: finguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finguard -d finguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tests/conftest.py uses this DSN instead of starting the embedded PostgreSQL.
      MODULE4_TEST_DSN: postgresql://finguard:finguard-ci@localhost:5432/finguard_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt

      # Same CI-only CUDA exclusion as the backend job (see the comment there).
      - name: Install dependencies (without CUDA packages)
        run: |
          grep -vE '^(--extra-index-url|torch==|sentence-transformers|transformers)' backend/requirements.txt > "$RUNNER_TEMP/ci-requirements.txt"
          grep -v '^-r ' tests/requirements.txt >> "$RUNNER_TEMP/ci-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/ci-requirements.txt"

      - name: Run pytest (db marker)
        run: python -m pytest -q -rs --strict-markers -m "db and not gpu"

  frontend-test:
    name: Frontend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # frontend/Dockerfile uses node:22; package.json requires >=22.18.0.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
