name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Dockerfile pins Python 3.11 for the backend.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt

      # Runners have no GPU and every GPU path in the tests is mocked, so the CUDA wheels
      # (torch+cu128, sentence-transformers, transformers) are left out. All other pins stay as written.
      - name: Install dependencies
        run: |
          grep -vE '^(--extra-index-url|torch==|sentence-transformers|transformers)' backend/requirements.txt > ci-requirements.txt
          grep -v '^-r ' tests/requirements.txt >> ci-requirements.txt
          python -m pip install -r ci-requirements.txt

      # Tests needing a real PostgreSQL (marker "db") or CUDA GPU (marker "gpu") are deselected.
      - name: Run pytest
        run: python -m pytest -q --strict-markers -m "not gpu and not db"

  frontend-test:
    name: Frontend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # frontend/Dockerfile uses node:22; package.json requires >=22.18.0.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
