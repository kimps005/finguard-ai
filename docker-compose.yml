services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BACKEND_INTERNAL_URL: ${COMPOSE_BACKEND_INTERNAL_URL:-http://backend:8000}
      APP_ACCESS_PIN: ${APP_ACCESS_PIN:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: .
    gpus: all
    volumes:
      - ./data/huggingface:/root/.cache/huggingface
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: unless-stopped
    environment:
      PGHOST: ${COMPOSE_PGHOST:-db}
      PGPORT: ${COMPOSE_PGPORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-finguard}
      PGUSER: ${POSTGRES_USER:-finguard}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGCONNECT_TIMEOUT: "5"
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/0}
      DART_API_KEY: ${DART_API_KEY:-}
      FSC_SERVICE_KEY: ${FSC_SERVICE_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      NAVER_API_HUB: ${NAVER_API_HUB:-false}
      ECOS_API_KEY: ${ECOS_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      ANALYST_MODEL: ${ANALYST_MODEL:-qwen3.7-plus}
      ANSWER_MODEL: ${ANSWER_MODEL:-qwen3.8-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-gemini-3.8-flash}
      JUDGE_MODEL: ${JUDGE_MODEL:-gemini-3.8-flash}
      BROKER_PROVIDER: ${BROKER_PROVIDER:-toss}
      TOSS_CLIENT_ID: ${TOSS_CLIENT_ID:-}
      TOSS_CLIENT_SECRET: ${TOSS_CLIENT_SECRET:-}
      TOSS_ACCOUNT_SEQ: ${TOSS_ACCOUNT_SEQ:-}
      IS_VIRTUAL: ${IS_VIRTUAL:-true}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO:-}
      KIS_ACCOUNT_PRODUCT_CODE: ${KIS_ACCOUNT_PRODUCT_CODE:-01}
      KIS_VIRTUAL_APP_KEY: ${KIS_VIRTUAL_APP_KEY:-}
      KIS_VIRTUAL_APP_SECRET: ${KIS_VIRTUAL_APP_SECRET:-}
      KIS_VIRTUAL_ACCOUNT_NO: ${KIS_VIRTUAL_ACCOUNT_NO:-}
      KIS_VIRTUAL_ACCOUNT_PRODUCT_CODE: ${KIS_VIRTUAL_ACCOUNT_PRODUCT_CODE:-01}
      KRX_ID: ${KRX_ID:-}
      KRX_PW: ${KRX_PW:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.7-pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finguard}
      POSTGRES_USER: ${POSTGRES_USER:-finguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./backend/migrations/001_module1.sql:/docker-entrypoint-initdb.d/001_module1.sql:ro
      - ./backend/migrations/004_module4.sql:/docker-entrypoint-initdb.d/004_module4.sql:ro
      - ./backend/migrations/006_price_card_log.sql:/docker-entrypoint-initdb.d/006_price_card_log.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
